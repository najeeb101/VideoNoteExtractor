# Render Blueprint for the backend API. The frontend is deployed separately on Vercel.
services:
  - type: web
    name: lectura-api
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: standard          # Whisper + ffmpeg need more than 512 MB RAM
    healthCheckPath: /docs
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL     # e.g. https://your-app.vercel.app
        sync: false
      - key: WHISPER_DEVICE
        value: cpu
